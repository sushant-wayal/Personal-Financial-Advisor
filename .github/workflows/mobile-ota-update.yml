name: Mobile App OTA Update

on:
  push:
    branches:
      - main
      - preview
      - production
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ota-update.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update Branch / Environment'
        required: true
        type: choice
        options:
          - both (preview & production)
          - preview
          - production
        default: 'both (preview & production)'
      message:
        description: 'Update message / description (optional)'
        required: false
        type: string
        default: ''

concurrency:
  group: mobile-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ota-update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          eas-cache: false

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci || npm install

      - name: Determine EAS Target Branches and Message
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_BRANCH="${{ github.event.inputs.branch }}"
            if [ "$SELECTED_BRANCH" = "both (preview & production)" ]; then
              TARGET_BRANCHES="preview production"
            else
              TARGET_BRANCHES="$SELECTED_BRANCH"
            fi

            CUSTOM_MSG="${{ github.event.inputs.message }}"
            if [ -n "$CUSTOM_MSG" ]; then
              UPDATE_MSG="$CUSTOM_MSG"
            else
              UPDATE_MSG="Manual OTA update trigger by ${{ github.actor }}"
            fi
          else
            CURRENT_BRANCH="${{ github.ref_name }}"
            # Normal CI push runs push OTA to both preview and production
            TARGET_BRANCHES="preview production"

            # Safe single-line commit message
            COMMIT_SUBJECT=$(git log -1 --pretty=format:'%s')
            COMMIT_HASH=$(git log -1 --pretty=format:'%h')
            UPDATE_MSG="[${CURRENT_BRANCH}] ${COMMIT_SUBJECT} (${COMMIT_HASH})"
          fi

          echo "target_branches=${TARGET_BRANCHES}" >> "$GITHUB_OUTPUT"
          echo "update_message=${UPDATE_MSG}" >> "$GITHUB_OUTPUT"

          echo "Target Branches: ${TARGET_BRANCHES}"
          echo "Update Message: ${UPDATE_MSG}"

      - name: Publish EAS OTA Update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for BRANCH in ${{ steps.params.outputs.target_branches }}; do
            echo "::group::Publishing OTA update to EAS branch: ${BRANCH}"
            eas update \
              --branch "${BRANCH}" \
              --message "${{ steps.params.outputs.update_message }}" \
              --non-interactive
            echo "::endgroup::"
          done

      - name: Generate Run Summary
        if: always()
        run: |
          echo "### 📱 North Mobile OTA Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target EAS Branches** | \`${{ steps.params.outputs.target_branches }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Git Branch / Ref** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Update Message** | ${{ steps.params.outputs.update_message }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered By** | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
